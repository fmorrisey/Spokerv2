name: 🚀 Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on v1.0.0, v2.1.3, etc.

jobs:
  # Run tests on GitHub-hosted runners
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm ci && npm run swagger:gen

      - name: 🧪 Run Unit Tests
        run: npm run test:unit

  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm ci && npm run swagger:gen

      - name: 🧪 Run Unit Tests
        run: npm test

  # Deploy on self-hosted runner (Rainier)
  deploy:
    name: 🚀 Deploy to Production
    runs-on: self-hosted
    needs: [test-backend, test-frontend]
    environment: production

    steps:
      - name: 📥 Fetch and Checkout Tag
        run: |
          cd ~/code/spokerv2
          echo "📥 Fetching latest changes..."
          git fetch --all --tags
          echo "🏷️ Checking out ${{ github.ref_name }}..."
          git checkout ${{ github.ref_name }}

      - name: 🐳 Build and Deploy Containers
        run: |
          cd ~/code/spokerv2
          echo "🐳 Building and deploying containers..."
          docker compose -f deploy/docker-compose.prod.yml up -d --build

      - name: ⏳ Wait for Services
        run: sleep 15

      - name: 🏥 Health Check
        run: |
          echo "🔍 Checking container status..."
          docker ps --filter "name=spoker"

          # Verify containers are running
          if ! docker ps | grep -q "spoker-caddy"; then
            echo "❌ Caddy is not running"
            exit 1
          fi
          echo "✅ Caddy is running"

          if ! docker ps | grep -q "spoker-frontend"; then
            echo "❌ Frontend is not running"
            exit 1
          fi
          echo "✅ Frontend is running"

          if ! docker ps | grep -q "spoker-backend"; then
            echo "❌ Backend is not running"
            exit 1
          fi
          echo "✅ Backend is running"

          # API health check
          if curl -sf http://localhost:8080/api/v1/health -H "Host: spoker-app.rainierserver.com" > /dev/null; then
            echo "✅ API health check passed"
          else
            echo "❌ API health check failed"
            exit 1
          fi

      - name: 📢 Deployment Summary
        if: success()
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://spoker-app.rainierserver.com" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Cleanup Old Images
        if: success()
        run: |
          echo "🧹 Cleaning up old Docker images..."
          docker image prune -f
