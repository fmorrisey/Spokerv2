version: '3.9'

services:
  nginx:
    image: spokerv2-nginx-prod
    build: ./nginx
    ports:
      - "3202:80"
    volumes:
      - nginx-logs:/var/log/nginx
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/certbot
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - frontend
      - backend

  frontend:
    image: spokerv2-frontend-prod
    build: ./frontend
    expose:
      - "80"
    environment:
      - NODE_ENV=production
      # Empty string enables relative paths for nginx proxying
      # Set to external API URL if backend is on a different domain
      - API_URL=""
      - ENABLE_ANALYTICS=true
      - ENABLE_DEBUG=false
    depends_on:
      - backend

  backend:
    image: spokerv2-backend-prod
    build: ./backend
    expose:
      - "5001"
    env_file:
      - ./backend/.env.prod
    environment:
      - NODE_ENV=production
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5001"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nginx-logs:
  certbot-etc:
  certbot-var:
  web-root:
