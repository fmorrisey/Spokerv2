# Production Docker Compose for Cloudflare Tunnel deployment
# Usage: docker compose -f deploy/docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    container_name: spoker-caddy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: spoker-frontend
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: spoker-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  caddy_data:
  caddy_config:
