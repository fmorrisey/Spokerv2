# Production Docker Compose for Cloudflare Tunnel deployment
# Usage: docker compose -f deploy/docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    container_name: "${APP_NAME:-spoker}-caddy"
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: "${APP_NAME:-spoker}-frontend"
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: "${APP_NAME:-spoker}-backend"
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  caddy_data:
  caddy_config:
