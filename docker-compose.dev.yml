version: '3.9'

services:
  nginx:
    image: spokerv2-nginx-dev
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    ports:
      - "3201:80"
    depends_on:
      - frontend
      - backend

  frontend:
    image: spokerv2-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "80"
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development

  backend:
    image: spokerv2-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    expose:
      - "5001"
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
